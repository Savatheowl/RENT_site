{% extends "base.html" %}
{% block title %}Контакты — RENTA{% endblock %}
{% block content %}
<div class="container py-5">
    <h2 class="mb-4">Контакты</h2>
    <div class="row">
        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <h5>Свяжитесь с нами</h5>
                <p class="mb-2"><i class="bi bi-envelope me-2" style="color: var(--accent);"></i> info@renta.ru</p>
                <p class="mb-2"><i class="bi bi-telephone me-2" style="color: var(--accent);"></i> +7 (999) 123-45-67</p>
                <p class="mb-2"><i class="bi bi-geo-alt me-2" style="color: var(--accent);"></i> г. Москва, ул. Тверская, д. 1</p>
                <p class="mb-0"><i class="bi bi-clock me-2" style="color: var(--accent);"></i> Пн-Пт: 10:00 – 19:00</p>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm p-4">
                <h5>Социальные сети</h5>
                <p class="mb-1"><a href="#" class="text-decoration-none">Telegram</a></p>
                <p class="mb-1"><a href="#" class="text-decoration-none">VKontakte</a></p>
                <p class="mb-0"><a href="#" class="text-decoration-none">Instagram</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
